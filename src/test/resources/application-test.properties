spring.application.name=usuarioService

# H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=false

# JWT - chave exclusiva para testes
jwt.secret=14I15oujcYSvV7r7Lghmg+HUMJ5n8YXDYmQoyHFiWMA=
jwt.expiration=36000000

# Servidor
server.port=8080
server.servlet.context-path=/