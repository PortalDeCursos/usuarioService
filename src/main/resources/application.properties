spring.application.name=usuarioService

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/usuarioDB
spring.datasource.username=postgres
spring.datasource.password=adm

# Configurações do JWT
jwt.expiration=${JWT_EXPIRATION:36000000}
jwt.secret=${JWT_SECRET:14I15oujcYSvV7r7Lghmg+HUMJ5n8YXDYmQoyHFiWMA=}

# Configurações do Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntax-highlight.theme=monokai


server.servlet.context-path=/api/usuarios/
