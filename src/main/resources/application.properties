spring.application.name=usuarioService

server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usuarioDB}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:adm}}

# Configurações do JWT
jwt.expiration=${JWT_EXPIRATION:36000000}
jwt.secret=${JWT_SECRET:14I15oujcYSvV7r7Lghmg+HUMJ5n8YXDYmQoyHFiWMA=}

# Configurações do Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntax-highlight.theme=monokai

server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/usuarios/}
